name: 패치 요청
description: 번역 패치가 있었으면 하는 게임을 알려 주세요. 요청 게시판에 표로 올라갑니다.
title: "[요청] "
labels: ["patch-request"]
body:
  - type: markdown
    attributes:
      value: |
        요청 게시판(https://ievy3.github.io/requests/)에 표로 올라갑니다. **게임 ROM·ISO 파일이나 다운로드 링크는 쓰지 마세요.**
        이미 등록된 게임이면 새로 쓰지 말고 해당 요청에 👍 을 눌러 주세요. 요청이 많다고 반드시 작업하는 것은 아니며, 작업 여부와 순서는 제작자가 정합니다.
  - type: input
    id: game
    attributes:
      label: 게임 이름
      description: 한국어·영어·일본어 어느 쪽이든 괜찮지만, 같은 게임을 찾을 수 있게 정식 제목으로 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      options:
        - PSP
        - PS Vita
        - PS2
        - PS1
        - GBA
        - NDS
        - 3DS
        - Switch
        - 모바일(피처폰)
        - PC
        - 기타
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: 한마디
      description: 이 게임을 요청하는 이유나 알려 두고 싶은 점이 있다면 적어 주세요. (선택)
    validations:
      required: false
  - type: checkboxes
    id: agree
    attributes:
      label: 확인
      options:
        - label: 게임 파일이나 다운로드 링크는 쓰지 않았습니다.
          required: true
        - label: 이미 같은 게임의 요청이 올라와 있지 않은지 확인했습니다.
          required: true
