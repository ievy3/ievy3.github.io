name: Update homepage project index

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "**.html"
      - "assets/data/projects.config.json"
      - "scripts/generate-projects.mjs"
      - "scripts/build-site-files.mjs"
      - ".github/workflows/update-project-index.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-project-index
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate project index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-projects.mjs

      - name: Build sitemap, feed and page metadata
        run: node scripts/build-site-files.mjs

      - name: Commit generated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated-data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh homepage project index"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push raced with another main update; regenerating on latest main (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            node scripts/generate-projects.mjs
            node scripts/build-site-files.mjs

            if [ -z "$(git status --porcelain)" ]; then
              echo "Remote main already contains equivalent generated data."
              exit 0
            fi

            git add -A
            git commit -m "chore: refresh homepage project index"
          done

          echo "Failed to publish generated project index after 3 attempts."
          exit 1
